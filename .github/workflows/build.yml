name: Build NetSwitch

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release, .NET Framework 4.8)
        run: dotnet build NetSwitch/NetSwitch.csproj -c Release -nologo

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item NetSwitch/bin/Release/net48/NetSwitch.exe dist/
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSwitch
          path: dist/NetSwitch.exe
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NetSwitch.exe
          generate_release_notes: true
